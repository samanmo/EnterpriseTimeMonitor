name: C/C++ CI Build Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install System Toolchain and Qt6 Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          qt6-base-dev \
          libpq-dev \
          qt6-base-dev-plugins

    - name: Configure CMake
      run: |
        mkdir build
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Execute Compile Build
      run: |
        cmake --build build --config Release

